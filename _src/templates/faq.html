<!DOCTYPE html>
<!-- GENERATED FILE — do not edit by hand. Edit _src/content.json or _src/templates/faq.html and rebuild with the site editor. -->
<html lang="en">
<head>
  <!-- Google tag (gtag.js) — only downloaded once an analytics id is set in the editor -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    (function (id) {
      if (!id) return;
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id=' + id;
      document.head.appendChild(s);
      gtag('js', new Date());
      gtag('config', id);
    })('{{site.analyticsId}}');
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{faq.seoTitle}}</title>
  <meta name="keywords" content="{{site.keywords}}" />
  <meta name="author" content="{{site.author}}" />
  <link rel="stylesheet" href="style.css" />

  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="img/touch.png">
  <!-- Icon font loads without blocking the first paint (media swaps to "all" once fetched) -->
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" media="print" onload="this.media='all'"/>
  <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/></noscript>

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "{{site.author}}",
      "url": "{{site.siteUrl}}",
      "jobTitle": "Session Bassist, Producer & Mixing Engineer",
      "sameAs": [
        "{{site.siteUrl}}"{{#each contact.links}},
        "{{url}}"{{/each}}
      ]
    }
  </script>
  <meta name="description" content="{{faq.seoDescription}}">

  <meta property="og:title" content="{{site.ogTitle}}" />
  <meta property="og:description" content="{{site.ogDescription}}" />
  <meta property="og:image" content="{{site.ogImage}}" />
  <meta property="og:url" content="{{site.siteUrl}}" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{site.twitterTitle}}" />
  <meta name="twitter:description" content="{{site.twitterDescription}}" />
  <meta name="twitter:image" content="{{site.ogImage}}" />
</head>
<body>
  <header>
    <div class="logo" data-logo-video="{{site.logoVideo}}" style="--logo-height: {{site.logoHeight}}px"><img src="{{site.logo}}" alt="{{site.author}} logo"></div>
    <div class="menu-toggle" onclick="toggleMenu()">
      <i class="fas fa-bars"></i>
    </div>
    <nav id="navbar">
      <a href="/">About</a>
      <a href="/#bass">Bass Playing</a>
      <a href="/#production">Production</a>
      <a href="/#reviews">Reviews</a>
      <a href="booking">Booking</a>
      <a href="/#contact">Contact</a>
      <a href="faq">FAQ and Policies</a>
    </nav>
  </header>

  <section id="faq-policies" style="padding-left: 50px; padding-right: 50px;">
    <br><br><br><br><br><br>

    <h2 style="text-align: center; margin-bottom: 1rem;">{{faq.heading}}</h2>

{{#each faq.sections}}    <h3>{{title}}</h3>
    <p>
    {{body}}
    </p>
    <br>

{{/each}}
  </section>

  <section id="contact">
     <div class="section-title">
        <h2>{{faq.contactHeading}}</h2>
        <p>{{faq.contactBlurb}}</p>
      </div>
      <form class="contact-form" action="{{contact.formAction}}" method="POST">
        <div class="row">
          <div class="col-lg-4">
            <input type="text" placeholder="Your Name" name="name" required>
          </div>
          <div class="col-lg-4">
            <input type="text" placeholder="Your E-mail" name="_replyto" required>
          </div>
          <div class="col-lg-4">
            <input type="text" placeholder="Subject" name="subject" required>
          </div>
          <div class="col-lg-12">
            <input type="text" placeholder="Message" name="msg" required>
            <div class="text-center">
              <button class="site-btn" value="Send">SEND IT!</button>
            </div>
          </div>
        </div>
      </form>
      <div class="ft-contact-widget">
        <p class="contact-links">
{{#each contact.links}}          <a href="{{url}}" target="_blank" rel="noopener" aria-label="{{ariaLabel}}"><i class="{{icon}}" aria-hidden="true"></i> {{label}}</a>
{{/each}}        </p>
        <p><a href="mailto:{{contact.email}}"><i class="fa fa-envelope"></i> {{contact.email}}</a></p>
      </div>
  </section>

  <script>
    function toggleMenu() {
      const nav = document.getElementById('navbar');
      nav.classList.toggle('active');
    }
  </script>
  <script src="logo.js" defer></script>

</body>
</html>
