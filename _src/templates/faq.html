<!DOCTYPE html>
<!-- GENERATED FILE — do not edit by hand. Edit _src/content.json or _src/templates/faq.html and rebuild with the site editor. -->
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id={{site.analyticsId}}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', '{{site.analyticsId}}');
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{faq.seoTitle}}</title>
  <meta name="keywords" content="{{site.keywords}}" />
  <meta name="author" content="{{site.author}}" />
  <link rel="stylesheet" href="style.css" />

  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="img/touch.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "{{site.author}}",
      "url": "{{site.siteUrl}}",
      "jobTitle": "Session Bassist, Producer & Mixing Engineer",
      "sameAs": [
        "{{contact.instagram}}",
        "{{contact.facebook}}"
      ]
    }
  </script>
  <meta name="description" content="{{faq.seoDescription}}">

  <meta property="og:title" content="{{site.ogTitle}}" />
  <meta property="og:description" content="{{site.ogDescription}}" />
  <meta property="og:image" content="{{site.ogImage}}" />
  <meta property="og:url" content="{{site.siteUrl}}" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{site.twitterTitle}}" />
  <meta name="twitter:description" content="{{site.twitterDescription}}" />
  <meta name="twitter:image" content="{{site.ogImage}}" />
</head>
<body>
  <header>
    <div class="logo"><img src="img/intro/logo.svg" alt="{{site.author}} logo"></div>
    <div class="menu-toggle" onclick="toggleMenu()">
      <i class="fas fa-bars"></i>
    </div>
    <nav id="navbar">
      <a href="/">About</a>
      <a href="/#bass">Bass Playing</a>
      <a href="/#production">Production</a>
      <a href="/#reviews">Reviews</a>
      <a href="booking">Booking</a>
      <a href="/#contact">Contact</a>
      <a href="faq">FAQ and Policies</a>
    </nav>
  </header>

  <section id="faq-policies" style="padding-left: 50px; padding-right: 50px;">
    <br><br><br><br><br><br>

    <h2 style="text-align: center; margin-bottom: 1rem;">{{faq.heading}}</h2>

{{#each faq.sections}}    <h3>{{title}}</h3>
    <p>
    {{body}}
    </p>
    <br>

{{/each}}
  </section>

  <section id="contact">
     <div class="section-title">
        <h2>{{faq.contactHeading}}</h2>
        <p>{{faq.contactBlurb}}</p>
      </div>
      <form class="contact-form" action="{{contact.formAction}}" method="POST">
        <div class="row">
          <div class="col-lg-4">
            <input type="text" placeholder="Your Name" name="name" required>
          </div>
          <div class="col-lg-4">
            <input type="text" placeholder="Your E-mail" name="_replyto" required>
          </div>
          <div class="col-lg-4">
            <input type="text" placeholder="Subject" name="subject" required>
          </div>
          <div class="col-lg-12">
            <input type="text" placeholder="Message" name="msg" required>
            <div class="text-center">
              <button class="site-btn" value="Send">SEND IT!</button>
            </div>
          </div>
        </div>
      </form>
      <div class="ft-contact-widget">
        <p><a href="{{contact.instagram}}" target="_blank"><i class="fa-brands fa-instagram"></i> Instagram</a></p>
        <p><a href="{{contact.facebook}}" target="_blank"><i class="fa-brands fa-facebook"></i> Facebook</a></p>
        <p><a href="mailto:{{contact.email}}"><i class="fa fa-envelope"></i> {{contact.email}}</a></p>
        <p><a href="tel:{{contact.phoneHref}}"><i class="fa fa-phone"></i> {{contact.phone}}</a></p>
      </div>
  </section>

  <script>
    function toggleMenu() {
      const nav = document.getElementById('navbar');
      nav.classList.toggle('active');
    }
  </script>

</body>
</html>
